name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Pack the code bundle
        if: matrix.os == 'windows-latest'
        run: npm run kod
      - uses: actions/upload-artifact@v4
        with:
          name: quizloop-${{ matrix.os }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/*.blockmap
            dist/desktop/latest*.yml
            dist/desktop/kod.json
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      QUIZLOOP_KEYSTORE: /tmp/quizloop-upload.jks
      QUIZLOOP_KEY_ALIAS: upload
      QUIZLOOP_STORE_PASSWORD: ${{ secrets.QUIZLOOP_STORE_PASSWORD }}
      QUIZLOOP_KEY_PASSWORD: ${{ secrets.QUIZLOOP_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - run: npm ci
      - name: Restore the upload key
        run: echo "${{ secrets.QUIZLOOP_KEYSTORE_BASE64 }}" | base64 -d > "$QUIZLOOP_KEYSTORE"
      - run: npm run android:release
      - name: Fail when the build is unsigned
        run: ls dist/android/QuizLoop-*-release.apk dist/android/QuizLoop-*-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: quizloop-android
          path: dist/android/*-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: dist/android/*-release.aab
          if-no-files-found: error

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: quizloop-*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true

  web:
    needs: [build, android]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  play:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: play-aab
          path: dist/android
      - name: Upload to the Play closed test
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.teknesyum.QuizLoop
          releaseFiles: dist/android/QuizLoop-*-release.aab
          track: alpha
          status: completed
